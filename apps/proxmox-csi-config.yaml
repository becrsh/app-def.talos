apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-csi-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/becrsh/app-def.talos
    targetRevision: main
    path: manifests/proxmox-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: csi-proxmox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
