# Helm OCI registry for the agentgateway charts. Public, no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: repo-agentgateway-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: agentgateway
  type: helm
  url: cr.agentgateway.dev/charts
  enableOCI: "true"
