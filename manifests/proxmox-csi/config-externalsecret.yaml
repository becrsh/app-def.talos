apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
  namespace: csi-proxmox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-infra
  target:
    name: proxmox-csi-config
    template:
      data:
        config.yaml: |
          clusters:
            - url: {{ .url }}
              insecure: true
              token_id: "{{ .token_id }}"
              token_secret: "{{ .token_secret }}"
              region: homelab
  dataFrom:
    - extract:
        key: proxmox-csi
