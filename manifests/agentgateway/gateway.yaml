apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan
  namespace: agentgateway-system
  annotations:
    cert-manager.io/cluster-issuer: bcc-ca
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.bcc.test"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-bcc-test
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
