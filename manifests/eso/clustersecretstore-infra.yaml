apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-infra
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.bcc.test/tier: infra
  provider:
    vault:
      server: "http://openbao.openbao.svc:8200"
      path: "infra"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-infra"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

