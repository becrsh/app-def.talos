apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-talos-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-infra
  target:
    name: repo-talos-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/becrsh/app-def.talos
        githubAppID: "{{ .appId }}"
        githubAppInstallationID: "{{ .installationId }}"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: appId
      remoteRef: { key: argocd/github-app, property: appId }
    - secretKey: installationId
      remoteRef: { key: argocd/github-app, property: installationId }
    - secretKey: privateKey
      remoteRef: { key: argocd/github-app, property: privateKey }
